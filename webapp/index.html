<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar RGB Pro</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=9.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="glass-card">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="icon-btn" id="btn-genres"><span class="material-icons-round">grid_view</span></button>
                <div class="status-pill"><span class="dot"></span> <span id="current-genre">SOLAR RADIO</span></div>
                <button class="icon-btn" id="btn-playlist"><span class="material-icons-round">auto_awesome_motion</span></button>
            </div>

            <!-- Visualizer Section -->
            <div class="main-visualizer">
                <div class="rgb-ring"></div>
                <div id="canvas-container"></div>
            </div>

            <!-- Info Section -->
            <div class="track-details">
                <h1 id="track-title">Музыка не выбрана</h1>
                <p id="track-artist">Нажмите кнопку «Жанры»</p>
            </div>

            <!-- Progress Section -->
            <div class="progress-container">
                <div class="time-info">
                    <span id="curr-time">0:00</span>
                    <span id="dur-time">0:00</span>
                </div>
                <div class="bar-bg" id="progress-clickable">
                    <div class="bar-fill" id="progress-bar"></div>
                </div>
            </div>

            <!-- Control Bar -->
            <div class="main-controls">
                <button class="side-btn" id="btn-prev"><span class="material-icons-round">skip_previous</span></button>
                <button class="play-btn" id="btn-play-pause"><span class="material-icons-round" id="icon-play">play_arrow</span></button>
                <button class="side-btn" id="btn-next"><span class="material-icons-round">skip_next</span></button>
            </div>
        </div>
    </div>

    <!-- Drawers -->
    <div class="overlay" id="overlay"></div>
    <div class="drawer" id="drawer-genres">
        <div class="drawer-header"><h3>Выберите жанр</h3></div>
        <div class="genre-grid" id="genre-grid"></div>
    </div>
    <div class="drawer" id="drawer-playlist">
        <div class="drawer-header"><h3>Очередь</h3></div>
        <div id="playlist-content"></div>
    </div>

    <audio id="audio-player" crossorigin="anonymous" playsinline></audio>
    <script type="module" src="js/main.js"></script>
</body>
</html>
