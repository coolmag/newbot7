<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="visualizer-canvas"></canvas>

    <div id="app-container">
        
        <div class="player-card">
            <!-- Верхняя панель -->
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <button class="btn" id="btn-open-genres"><span class="material-icons-round">grid_view</span></button>
                <span class="title-bar">AURORA OS v4.0</span>
                <button class="btn" id="btn-open-playlist"><span class="material-icons-round">playlist_play</span></button>
            </div>

            <!-- Реактор -->
            <div class="reactor-container">
                <div class="reactor-ring"></div>
                <div class="reactor-ring"></div>
                <div class="reactor-core">
                    <span class="material-icons-round" style="font-size: 40px; color: rgba(255,255,255,0.2);">music_note</span>
                </div>
            </div>

            <div class="track-info">
                <h1 id="track-title">System Ready</h1>
                <p id="track-artist">Waiting for command</p>
            </div>

            <div class="progress-container">
                <div class="progress-bg">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <!-- Shuffle кнопка добавлена слева -->
                <button class="btn small" id="btn-shuffle" style="color: #666;">
                    <span class="material-icons-round">shuffle</span>
                </button>
                
                <button class="btn" id="btn-prev"><span class="material-icons-round">skip_previous</span></button>
                
                <button class="btn btn-main" id="btn-play-pause">
                    <span class="material-icons-round">play_arrow</span>
                </button>
                
                <button class="btn" id="btn-next"><span class="material-icons-round">skip_next</span></button>
                
                <!-- Repeat кнопка добавлена справа (для симметрии) -->
                <button class="btn small" style="opacity: 0.3; cursor: default;">
                    <span class="material-icons-round">repeat</span>
                </button>
            </div>
            
            <!-- Консоль отладки -->
            <div id="system-log" class="system-log">
                [SYSTEM] Online
            </div>
        </div>

        <!-- Оверлей инициализации -->
        <div id="start-overlay" class="start-screen">
            <div class="start-title">AURORA OS</div>
            <div class="start-subtitle">SECURE CONNECTION ESTABLISHED</div>
            <button id="btn-start-system" class="start-btn">INITIALIZE SYSTEM</button>
        </div>

        <div class="overlay" id="overlay"></div>
        <div class="drawer" id="drawer-genres">
            <h2 class="drawer-title">Frequency Select</h2>
            <div class="scroll-area genre-grid" id="genre-grid"></div>
        </div>
        <div class="drawer" id="drawer-playlist">
            <h2 class="drawer-title">Active Queue</h2>
            <div class="scroll-area" id="playlist-container"></div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(r => r.update());
        }
    </script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
