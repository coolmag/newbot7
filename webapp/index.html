<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Player</title>
    
    <!-- Предзагрузка шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Легкий Canvas (2D) -->
        <canvas id="visualizer-canvas"></canvas>

        <div class="player-card">
            <div class="card-header">
                <button class="btn" id="btn-open-genres"><span class="material-icons-round">category</span></button>
                <div class="title-bar">AURORA</div>
                <button class="btn" id="btn-open-playlist"><span class="material-icons-round">queue_music</span></button>
            </div>

            <div class="track-info-container">
                <div class="track-artwork-placeholder"></div>
                <h1 id="track-title">Ready</h1>
                <p id="track-artist">Tap to start</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="btn-prev"><span class="material-icons-round">skip_previous</span></button>
                <button class="btn btn-main" id="btn-play-pause"><span class="material-icons-round">play_arrow</span></button>
                <button class="btn" id="btn-next"><span class="material-icons-round">skip_next</span></button>
            </div>
        </div>

        <div class="overlay" id="overlay"></div>
        <div class="drawer" id="drawer-genres">
            <h2>Select Frequency</h2>
            <div class="scroll-area genre-grid" id="genre-grid"></div>
        </div>
        <div class="drawer" id="drawer-playlist">
            <h2>Current Queue</h2>
            <div class="scroll-area" id="playlist-container"></div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // Force Reload при обновлении SW
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                reg.onupdatefound = () => {
                    const i = reg.installing;
                    i.onstatechange = () => {
                        if (i.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    }
                }
            });
        }
    </script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
