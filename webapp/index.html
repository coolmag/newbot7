<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Player</title>
    <link rel="stylesheet" href="style.css?v=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12121e">
    <meta name="mobile-web-app-capable" content="yes">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="app-container">
        <!-- 3D фон будет здесь -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- Центральная карточка плеера -->
        <div class="player-card">
            <div class="card-header">
                <button class="icon-btn" id="btn-genres">
                    <span class="material-icons-round">queue_music</span>
                </button>
                <div class="status-display">
                    <span class="dot"></span>
                    <span id="current-genre">Aurora</span>
                </div>
                <button class="icon-btn" id="btn-settings">
                    <span class="material-icons-round">settings</span>
                </button>
            </div>

            <div class="track-artwork">
                <!-- Сюда можно будет вставлять album art, пока это просто контейнер -->
            </div>

            <div class="track-info">
                <h1 id="track-title">Трек не выбран</h1>
                <p id="track-artist">Откройте меню жанров</p>
            </div>

            <div class="progress-bar-container">
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-duration">0:00</span>
                </div>
                <div class="progress-bar" id="progress-bar-clickable">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>

            <div class="controls">
                <button class="icon-btn large" id="btn-prev">
                    <span class="material-icons-round">skip_previous</span>
                </button>
                <button class="icon-btn play-btn" id="btn-play-pause">
                    <span class="material-icons-round">play_arrow</span>
                </button>
                <button class="icon-btn large" id="btn-next">
                    <span class="material-icons-round">skip_next</span>
                </button>
            </div>
        </div>

        <!-- Оверлей для модальных окон -->
        <div class="overlay" id="overlay"></div>
        
        <!-- Модальное окно жанров -->
        <div class="drawer" id="genres-drawer">
            <h2>Выберите Жанр</h2>
            <div class="genre-list" id="genre-list">
                <!-- Жанры будут добавлены динамически -->
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script src="js/main.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
              .then(reg => console.log('Service Worker: Registered'))
              .catch(err => console.error('Service Worker: Registration failed', err));
        }
    </script>
</body>
</html>
