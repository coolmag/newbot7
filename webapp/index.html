<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar RGB Radio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three @0.160.0/build/three.module.js"
        }
    }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="screen screen-player active">
        <div class="player-container">
            <div class="header">
                <span class="material-icons-round header-btn" id="btn-genres">apps</span>
                <div class="live-badge">
                    <span class="live-dot"></span>
                    <span id="current-genre">RGB RADIO</span>
                </div>
                <span class="material-icons-round header-btn" id="btn-playlist">queue_music</span>
            </div>

            <div class="visualizer-container">
                <div class="led-ring" id="led-ring"></div>
                <div id="canvas-container"></div>
            </div>

            <div class="track-info">
                <div class="title" id="track-title">Solar Radio</div>
                <div class="artist" id="track-artist">Выберите жанр</div>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progress-container">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="curr-time">0:00</span>
                    <span id="dur-time">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="btn-prev"><span class="material-icons-round">skip_previous</span></button>
                <button class="ctrl-btn ctrl-btn-main" id="btn-play-pause">
                    <span class="material-icons-round" id="icon-play">play_arrow</span>
                </button>
                <button class="ctrl-btn" id="btn-next"><span class="material-icons-round">skip_next</span></button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="drawer" id="screen-genres">
        <div class="drawer-handle"></div>
        <div class="genre-grid" id="genre-grid"></div>
    </div>
    <div class="drawer" id="playlist-drawer">
        <div class="drawer-handle"></div>
        <div id="playlist-content"></div>
    </div>

    <audio id="audio-player" crossorigin="anonymous" playsinline></audio>
    <script type="module" src="js/main.js"></script>
</body>
</html>
