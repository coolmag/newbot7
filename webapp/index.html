<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🎧 CoolMag Radio</title>

  <link rel="stylesheet" href="/webapp/style.css?v=7.1" />
  <link rel="icon" href="/webapp/favicon.svg" />
</head>

<body>
  <div id="visualizer"></div>

  <div id="player-ui">
    <h1>🎵 CoolMag Radio</h1>
    <div class="controls">
      <button id="playBtn">▶️ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="nextBtn">⏭ Next</button>
      <button id="playlistBtn">📜 Classic Rock</button>
    </div>
    <audio id="player" preload="none" controls></audio>
    <div id="playlist"></div>
  </div>

  <!-- Telegram WebApp API -->
  <script src="/webapp/js/telegram-web-app.js"></script>
  
  <!-- Main App Logic -->
  <script type="module" src="/webapp/js/main.js?v=7.1"></script>
</body>
</html>
