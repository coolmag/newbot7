<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Space Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three @0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="app-container">
        <!-- 3D Фон -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- Плеер -->
        <div class="player-card">
            <div class="card-header">
                <button class="btn" id="btn-open-genres">
                    <span class="material-icons-round">category</span>
                </button>
                <div class="title-bar">Aurora OS</div>
                <button class="btn" id="btn-open-playlist">
                    <span class="material-icons-round">queue_music</span>
                </button>
            </div>

            <div class="track-info-container">
                <div class="track-artwork-placeholder"></div>
                <h1 id="track-title">System Ready</h1>
                <p id="track-artist">Select a frequency</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="btn-prev">
                    <span class="material-icons-round">skip_previous</span>
                </button>
                <button class="btn btn-main" id="btn-play-pause">
                    <span class="material-icons-round">play_arrow</span>
                </button>
                <button class="btn" id="btn-next">
                    <span class="material-icons-round">skip_next</span>
                </button>
            </div>
        </div>

        <!-- Оверлей -->
        <div class="overlay" id="overlay"></div>

        <!-- Меню Жанров -->
        <div class="drawer" id="drawer-genres">
            <h2>Frequency</h2>
            <div class="scroll-area genre-grid" id="genre-grid"></div>
        </div>

        <!-- Меню Плейлиста -->
        <div class="drawer" id="drawer-playlist">
            <h2>Playlist</h2>
            <div class="scroll-area" id="playlist-container"></div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script src="js/main.js" type="module"></script>
</body>
</html>
